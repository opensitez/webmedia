[package]
name = "webmedia"
version = "0.1.0"
edition = "2024"
description = "Standalone raster image and streaming video decoders for Rust applications"
documentation = "https://docs.rs/webmedia"
license = "GPL-3.0-or-later OR LicenseRef-Commercial"
readme = "README.md"
keywords = ["media", "image", "video", "decoder", "streaming"]
categories = ["multimedia", "multimedia::images", "multimedia::video"]
include = ["src/**", "tests/fixtures/fonts/**", "Cargo.toml", "README.md", "LICENSE-GPL"]

[features]
default = ["bitmap", "video"]
bitmap = ["dep:image"]
video = []
font = ["dep:brotli", "dep:flate2", "dep:url"]
audio-symphonia = ["video", "dep:symphonia"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
brotli = { version = "8", optional = true }
flate2 = { version = "1", optional = true }
url = { version = "2", optional = true }
symphonia = { version = "0.5", optional = true, default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[dev-dependencies]
fontdb = "0.23.0"
